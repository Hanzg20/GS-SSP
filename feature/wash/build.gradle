plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.goldsky.ssp.feature.wash'
    compileSdk 34

    defaultConfig {
        minSdk 25
        buildConfigField "boolean", "IS_MOCK", "true"
        // Old monolith had these auto-generated by its "wash" product flavor;
        // this module has no flavor dimension of its own, so they're supplied
        // directly instead -- only used for on-screen "vX.Y (wash)"-style
        // diagnostics text, not for any branching logic.
        buildConfigField "String", "FLAVOR", "\"wash\""
        buildConfigField "String", "VERSION_NAME", "\"1.0.0-wash\""
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    
    kotlinOptions {
        jvmTarget = '11'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    api project(':core:common')
    api project(':core:data')
    api project(':core:ui')
    api project(':core:hardware')
    api project(':core:payment')

    implementation 'androidx.compose.ui:ui:1.5.4'
    implementation 'androidx.compose.material3:material3:1.1.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.6.1'
    implementation 'androidx.navigation:navigation-compose:2.7.4'
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.5.1"
}
