plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'com.goldsky.ssp.core.data'
    compileSdk 34
    buildToolsVersion "36.0.0"

    defaultConfig {
        minSdk 25
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    api 'androidx.core:core-ktx:1.9.0'
    api 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.1'
    api "androidx.work:work-runtime-ktx:2.9.0"
    
    api project(':core:common')
    api project(':core:hardware')
    
    api "io.github.jan-tennert.supabase:postgrest-kt:2.6.1"
    api "io.github.jan-tennert.supabase:gotrue-kt:2.6.1"
    api "io.github.jan-tennert.supabase:realtime-kt:2.6.1"
    api "io.github.jan-tennert.supabase:storage-kt:2.6.1"

    def ktor_version = "2.3.12"
    api "io.ktor:ktor-client-core:$ktor_version"
    api "io.ktor:ktor-client-okhttp:$ktor_version"
    api "io.ktor:ktor-client-content-negotiation:$ktor_version"
    api "io.ktor:ktor-serialization-kotlinx-json:$ktor_version"
    
    def room_version = "2.6.1"
    api "androidx.room:room-runtime:$room_version"
    api "androidx.room:room-ktx:$room_version"
    ksp "androidx.room:room-compiler:$room_version"
    
    api "org.jetbrains.kotlinx:kotlinx-serialization-json:1.5.1"

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.6.4'
}
