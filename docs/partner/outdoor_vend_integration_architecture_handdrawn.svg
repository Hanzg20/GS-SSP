<text x="1072" y="751" class="tiny">Door · scale · camera · sensors · stock · alarms</text>
<text x="1072" y="775" class="tiny">No GoldSky hardware or software on controller</text>
<text x="1072" y="799" class="tiny">Keeps an order-number and hand-over result log</text>
