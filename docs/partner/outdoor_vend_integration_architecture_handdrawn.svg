<text x="915" y="794" text-anchor="middle" class="tiny">GET status · POST hand-over</text>
<!-- operational rules footer -->
<path d="M88 881 Q87 873 98 873 L1498 875 Q1509 876 1508 888 L1507 930 Q1505 939 1495 938 L99 937 Q88 936 88 926Z" fill="#fff" stroke="#b7c1c2" stroke-width="1.5"/>
<text x="111" y="899" class="body" style="font-weight:700">Payment rule:</text><text x="207" y="899" class="body">keep the charge only after DISPENSED for the same order number; failure or timeout → cancel.</text>
<text x="111" y="923" class="tiny">The terminal always starts the controller requests. Outdoor Vend retains machine, stock and controller-cloud operations.</text>
<text x="111" y="949" class="tiny" fill="#66757c">Architecture based on “GoldSky Aegis Flex × Outdoor Vend — Payment Integration Proposal” · Draft for discussion · November 2026</text>
