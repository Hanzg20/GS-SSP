plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// Same local.properties -> BuildConfig pattern as app/iris and app/aegis-wash.
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

// Owner, 2026-11-02: GSPay ver 0.0.1. Earlier dev builds were 0.1.x / 0.2.0 -- a terminal
// that has one needs Vend uninstalled first (versionCode only goes up).
ext.appVersion = "0.0.1"

android {
    namespace 'com.goldsky.ssp.aegis.vend'
    compileSdk 34

    defaultConfig {
        applicationId "com.goldsky.ssp.aegis.vend"
        minSdk 25
        targetSdk 34
        // versionCode/versionName come from ext.appVersion, see gradle/release-signing.gradle

        buildConfigField "String", "SUPABASE_URL", "\"${localProperties.getProperty('supabase.url') ?: ''}\""
        buildConfigField "String", "SUPABASE_KEY", "\"${localProperties.getProperty('supabase.key') ?: ''}\""
        // false, as on Wash / Timer: IS_MOCK=true on a real-hardware shell silently
        // skipped every Supabase transaction write at a live site (2026-09-19).
        buildConfigField "boolean", "IS_MOCK", "false"
        // VMC simulator build (owner, 2026-11-02: no vending machine yet, test with our own):
        // `gradlew :app:aegis-vend:signRelease -Pvmcsim` -> aegis-vend-<v>-VMCSIM-signed.apk.
        // The vending machine is simulated (commands over adb, tools/vmc-sim.sh), the card
        // payments are REAL, and a red banner says so on every screen. Same id and key as the
        // release, so it installs over it on a test terminal (device secret kept) and the
        // release goes back over it the same way. Never for a store (no demo/sim modes on
        // Aegis, owner 2026-10-31): this flag is false in every normal build.
        buildConfigField "boolean", "VMC_SIM", "${project.hasProperty('vmcsim')}"
        if (project.hasProperty('vmcsim')) versionNameSuffix "-vmcsim"
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }
}

// cloudpos_sdk.aar is arm64/armeabi only, so the x86_64 dev emulator refuses an APK that
// carries its .so files: the DEBUG variant drops them (debug = emulator: screens and the
// simulator). Done per variant on purpose -- a packagingOptions block inside
// buildTypes { debug { } } is the android-wide one, and stripped the release too (2026-11-02:
// libjni_cloudpos_ext_board.so missing on 255, MDB open crashed). The signed release that
// terminals get keeps them.
androidComponents {
    onVariants(selector().withBuildType("debug")) { variant ->
        variant.packaging.jniLibs.excludes.add("**/*.so")
    }
}

apply from: rootProject.file('gradle/release-signing.gradle')

// The simulator build gets its own file name, so it can never pass for the release.
if (project.hasProperty('vmcsim')) {
    tasks.named('signRelease') {
        doLast {
            def dir = layout.buildDirectory.dir('outputs/apk/release').get().asFile
            dir.listFiles().findAll { it.name.endsWith('-signed.apk') && !it.name.contains('VMCSIM') }.each { f ->
                def sim = new File(dir, f.name.replace('-signed.apk', '-VMCSIM-signed.apk'))
                sim.delete()
                f.renameTo(sim)
                println("VMC simulator APK: $sim")
            }
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation project(':core:common')
    implementation project(':core:data')
    implementation project(':core:hardware')
    implementation project(':core:ui')
    implementation project(':core:payment')
    implementation project(':feature:vending')
    implementation project(':libs:pax')
    implementation project(':libs:wizarpos')

    implementation 'androidx.activity:activity-compose:1.7.0'
}
