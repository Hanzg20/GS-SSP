apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'com.google.devtools.ksp'
apply plugin: 'kotlinx-serialization'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

android {
    namespace 'com.goldsky.ssp'
    compileSdk 34
    buildToolsVersion "35.0.0"

    defaultConfig {
        applicationId "com.goldsky.ssp"
        minSdk 25 // Android 7.1 (PAX IM30/IM25 target)
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "SUPABASE_URL", "\"${localProperties.getProperty('supabase.url') ?: ''}\""
        buildConfigField "String", "SUPABASE_KEY", "\"${localProperties.getProperty('supabase.key') ?: ''}\""
    }

    flavorDimensions "product", "environment"
    
    productFlavors {
        // Vertical Product Flavors
        wash { dimension "product"; manifestPlaceholders = [appName: "GS-SSP Wash"] }
        vending { dimension "product"; manifestPlaceholders = [appName: "GS-SSP Vending"] }
        parking { dimension "product"; manifestPlaceholders = [appName: "GS-SSP Parking"] }
        ev { dimension "product"; manifestPlaceholders = [appName: "GS-SSP EV Charging"] }
        retail { dimension "product"; manifestPlaceholders = [appName: "GS-SSP Retail"] }

        // Environment Flavors
        real {
            dimension "environment"
            // Standard ARM binaries for production hardware
            ndk { abiFilters "armeabi-v7a", "arm64-v8a" }
            buildConfigField "boolean", "IS_MOCK", "false"
        }
        
        mock {
            dimension "environment"
            buildConfigField "boolean", "IS_MOCK", "true"
            // Strip ALL native libs to bypass ABI check on emulators
            packagingOptions {
                jniLibs {
                    excludes += ["lib/armeabi-v7a/*", "lib/arm64-v8a/*", "lib/x86/*", "lib/x86_64/*", "lib/armeabi/*"]
                }
            }
        }
    }

    // Per-variant applicationId suffixes
    applicationVariants.all { variant ->
        def flavorProduct = variant.productFlavors[0].name
        def flavorEnv = variant.productFlavors[1].name
        
        variant.mergedFlavor.applicationIdSuffix = ".${flavorProduct}"
        if (flavorEnv == "mock") {
            variant.mergedFlavor.applicationIdSuffix += ".mock"
            variant.mergedFlavor.versionNameSuffix = "-mock"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable false
            jniDebuggable false
        }
        debug {
            minifyEnabled false
            shrinkResources false
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
        coreLibraryDesugaringEnabled true
    }
    kotlinOptions {
        jvmTarget = '11'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.4.3'
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4'
    implementation 'com.google.zxing:core:3.5.2'
    implementation 'com.airbnb.android:lottie:6.0.0'

    implementation "io.github.jan-tennert.supabase:postgrest-kt:2.6.1"
    implementation "io.github.jan-tennert.supabase:gotrue-kt:2.6.1"
    implementation "io.github.jan-tennert.supabase:realtime-kt:2.6.1"
    implementation "io.github.jan-tennert.supabase:storage-kt:2.6.1"

    def ktor_version = "2.3.12"
    implementation "io.ktor:ktor-client-core:$ktor_version"
    implementation "io.ktor:ktor-client-android:$ktor_version"
    implementation "io.ktor:ktor-client-okhttp:$ktor_version"
    implementation "io.ktor:ktor-client-content-negotiation:$ktor_version"
    implementation "io.ktor:ktor-serialization-kotlinx-json:$ktor_version"
    implementation "io.ktor:ktor-client-logging:$ktor_version"
    implementation "io.ktor:ktor-client-auth:$ktor_version"

    implementation "androidx.work:work-runtime-ktx:2.9.0"
    implementation "io.coil-kt:coil:2.6.0"

    // Room Persistence
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    ksp "androidx.room:room-compiler:$room_version"

    def compose_bom = platform('androidx.compose:compose-bom:2024.04.01')
    implementation compose_bom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.6.1'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // Multi-Vendor SDKs
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation files('libs/PAX_POSLinkAndroid_20260202.aar')
    implementation files('libs/cloudpos_sdk.aar')
    implementation files('libs/UptApi_V1.02.jar')

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'io.github.jan-tennert.supabase') {
            details.useVersion '2.6.1'
        }
    }
}
