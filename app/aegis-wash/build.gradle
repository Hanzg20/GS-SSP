plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Same local.properties -> BuildConfig pattern as app/iris (see that
// build.gradle for the rationale).
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

ext.appVersion = "1.1.0"

android {
    namespace 'com.goldsky.ssp.aegis.wash'
    compileSdk 34

    defaultConfig {
        applicationId "com.goldsky.ssp.aegis.wash"
        minSdk 25
        targetSdk 34
        // versionCode/versionName come from ext.appVersion, see gradle/release-signing.gradle

        buildConfigField "String", "SUPABASE_URL", "\"${localProperties.getProperty('supabase.url') ?: ''}\""
        buildConfigField "String", "SUPABASE_KEY", "\"${localProperties.getProperty('supabase.key') ?: ''}\""
        // false so CoreConfig.isMock/HardwareConfig.isMock reflect real
        // hardware testing -- was hardcoded true, which made
        // TransactionRepository.recordTransactionRemote()/updatePaymentStatusRemote()
        // silently skip writing to Supabase entirely (logged "MOCK: Transaction
        // recorded (skipped remote)" and nothing else), so every real card
        // payment tested on a live WizarPOS Q3mini recorded zero revenue in
        // Eagleson Coin Wash's account -- confirmed live, 2026-09-19: the
        // transactions table had 0 rows for that device despite a full day of
        // real testing.
        buildConfigField "boolean", "IS_MOCK", "false"
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    // No debug-only jniLibs exclusion anymore -- it used to strip every .so
    // from the debug APK on the theory that IS_MOCK=true never called into
    // them, which stopped being true once IS_MOCK flipped to false above.
    // Worse, that exclusion was also silently discarding real, present
    // natives (libjni_cloudpos_ext_board.so, libjni_cloudpos_serial_multi.so,
    // etc. -- confirmed live in libs/wizarpos/cloudpos_sdk.aar's jni/
    // folders, 2026-09-19) that GPIO relay dispensing and the serial port
    // genuinely need on real WizarPOS hardware. Every "native lib not found"
    // crash fixed earlier today (WizarPosGpioProvider/WizarPosSerialProvider)
    // was this exclusion doing exactly what it was told to, not a real gap
    // in the vendor SDK. Testing against an x86_64 emulator is no longer
    // possible for this app shell as a result (INSTALL_FAILED_NO_MATCHING_ABIS,
    // same as any app shipping arm-only native code) -- acceptable since all
    // testing here is against real WizarPOS hardware.
}

apply from: rootProject.file('gradle/release-signing.gradle')

dependencies {
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation project(':core:common')
    implementation project(':core:data')
    implementation project(':core:hardware')
    implementation project(':core:ui')
    implementation project(':core:payment')
    implementation project(':feature:wash')
    implementation project(':libs:pax')
    implementation project(':libs:wizarpos')
}
